<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="残り枠">
<title>残り枠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424; --border:#2e2e2e;
    --text:#f0f0f0; --text2:#888; --text3:#555;
    --green:#00e676; --amber:#ffab40; --red:#ff5252;
    --amber-dim:#3d2e1a; --red-dim:#3d1a1a;
    --mono:'DM Mono',monospace; --sans:'Noto Sans JP',sans-serif;
  }
  html[data-theme="light"] {
    --bg:#f5f5f0; --surface:#ffffff; --surface2:#f0f0eb; --border:#e0e0d8;
    --text:#1a1a1a; --text2:#666; --text3:#aaa;
    --green:#00a854; --amber:#e08000; --red:#d93025;
    --amber-dim:#fff3e0; --red-dim:#fce8e6;
  }
  @media (prefers-color-scheme: light) {
    html[data-theme="system"] {
      --bg:#f5f5f0; --surface:#ffffff; --surface2:#f0f0eb; --border:#e0e0d8;
      --text:#1a1a1a; --text2:#666; --text3:#aaa;
      --green:#00a854; --amber:#e08000; --red:#d93025;
      --amber-dim:#fff3e0; --red-dim:#fce8e6;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; max-width:430px; margin:0 auto; padding-bottom:120px; transition:background 0.2s, color 0.2s; }

  .header { padding:56px 20px 20px; display:flex; justify-content:space-between; align-items:flex-end; }
  .header-title { font-size:11px; letter-spacing:0.2em; color:var(--text3); text-transform:uppercase; font-family:var(--mono); }
  .header-version { font-size:10px; color:var(--text3); font-family:var(--mono); margin-top:3px; }
  .header-month { font-size:13px; color:var(--text2); font-family:var(--mono); }

  .hero { padding:8px 20px 28px; }
  .hero-label { font-size:11px; color:var(--text3); letter-spacing:0.15em; font-family:var(--mono); margin-bottom:6px; }
  .hero-amount { font-size:52px; font-weight:700; font-family:var(--mono); line-height:1; letter-spacing:-0.02em; transition:color 0.3s; }
  .hero-amount.ok { color:var(--green); }
  .hero-amount.warn { color:var(--amber); }
  .hero-amount.over { color:var(--red); }
  .hero-sub { font-size:12px; color:var(--text3); font-family:var(--mono); margin-top:6px; }

  .progress-wrap { margin:0 20px 24px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
  .progress-bar { height:100%; border-radius:2px; transition:width 0.4s ease, background 0.3s; }

  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:0 20px 24px; }
  .stat { background:var(--surface); border-radius:12px; padding:12px 10px; border:1px solid var(--border); }
  .stat-label { font-size:10px; color:var(--text3); font-family:var(--mono); letter-spacing:0.08em; margin-bottom:5px; }
  .stat-value { font-size:15px; font-weight:500; font-family:var(--mono); color:var(--text); }
  .stat-value.transport { color:var(--amber); }

  /* Category breakdown */
  .breakdown-section { padding:0 20px 24px; }
  .breakdown-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:4px 0; -webkit-tap-highlight-color:transparent; }
  .breakdown-title { font-size:11px; color:var(--text3); font-family:var(--mono); letter-spacing:0.15em; }
  .breakdown-toggle { font-size:11px; color:var(--text3); font-family:var(--mono); transition:transform 0.25s; display:inline-block; }
  .breakdown-toggle.open { transform:rotate(180deg); }
  .breakdown-body { overflow:hidden; max-height:0; transition:max-height 0.3s ease; }
  .breakdown-body.open { max-height:600px; }
  .breakdown-list { display:flex; flex-direction:column; gap:6px; padding-top:10px; }
  .breakdown-item { border-radius:10px; padding:10px 14px; border:1px solid transparent; display:flex; justify-content:space-between; align-items:center; }
  .breakdown-left { display:flex; align-items:center; gap:8px; }
  .breakdown-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .breakdown-label { font-size:13px; color:var(--text2); }
  .breakdown-amount { font-size:14px; font-weight:500; font-family:var(--mono); }

  .input-section { padding:0 20px 20px; }
  .input-card { background:var(--surface); border-radius:16px; padding:18px; border:1px solid var(--border); }
  .input-label { font-size:11px; color:var(--text3); font-family:var(--mono); letter-spacing:0.15em; margin-bottom:12px; }
  .amount-input-wrap { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .yen-sign { font-size:24px; color:var(--text3); font-family:var(--mono); }
  .amount-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:28px; font-family:var(--mono); font-weight:500; padding:10px 14px; outline:none; width:100%; -webkit-appearance:none; }
  .amount-input:focus { border-color:var(--green); }
  .memo-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:15px; font-family:var(--sans); padding:10px 14px; outline:none; margin-bottom:14px; -webkit-appearance:none; }
  .memo-input:focus { border-color:var(--green); }
  .memo-input::placeholder { color:var(--text3); }

  .cat-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .cat-btn { background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text2); font-size:13px; font-family:var(--sans); padding:10px; cursor:pointer; transition:all 0.15s; text-align:center; -webkit-appearance:none; }
  .cat-btn.active { border-color:var(--green); color:var(--green); background:rgba(0,168,84,0.08); }
  .cat-btn.transport-btn.active { border-color:var(--amber); color:var(--amber); background:rgba(224,128,0,0.08); }
  .cat-btn:active { transform:scale(0.97); }

  .submit-btn { width:100%; background:var(--green); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; font-family:var(--sans); padding:16px; cursor:pointer; transition:all 0.15s; -webkit-appearance:none; letter-spacing:0.05em; }
  html[data-theme="dark"] .submit-btn, html[data-theme="system"] .submit-btn { color:#000; }
  @media (prefers-color-scheme:dark) { html[data-theme="system"] .submit-btn { color:#000; } }
  .submit-btn:active { transform:scale(0.98); opacity:0.9; }
  .submit-btn.transport-mode { background:var(--amber); }

  .history-section { padding:0 20px; }
  .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .section-title { font-size:11px; color:var(--text3); font-family:var(--mono); letter-spacing:0.15em; }
  .clear-btn { font-size:11px; color:var(--text3); background:none; border:none; font-family:var(--mono); cursor:pointer; padding:4px 8px; -webkit-appearance:none; }
  .clear-btn:active { color:var(--red); }
  .history-list { display:flex; flex-direction:column; gap:6px; }

  .history-item { border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; border:1px solid transparent; animation:slideIn 0.2s ease; cursor:pointer; transition:opacity 0.15s; }
  .history-item:active { opacity:0.75; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .history-left { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
  .history-cat { font-size:11px; font-family:var(--mono); }
  .history-memo { font-size:13px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:190px; }
  .history-right { display:flex; align-items:center; flex-shrink:0; }
  .history-amount { font-size:18px; font-weight:500; font-family:var(--mono); color:var(--text); }
  .empty-state { text-align:center; color:var(--text3); font-size:13px; font-family:var(--mono); padding:24px 0; }
  .edit-hint { font-size:11px; color:var(--text3); font-family:var(--mono); text-align:center; margin-bottom:10px; }

  .alert { margin:0 20px 16px; padding:12px 16px; border-radius:10px; font-size:13px; display:none; }
  .alert.warn { background:var(--amber-dim); color:var(--amber); border:1px solid rgba(224,128,0,0.3); display:block; }
  .alert.over { background:var(--red-dim); color:var(--red); border:1px solid rgba(217,48,37,0.3); display:block; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:none; align-items:flex-end; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border-radius:20px 20px 0 0; padding:24px 20px 40px; width:100%; border-top:1px solid var(--border); }
  .modal-title { font-size:13px; color:var(--text2); font-family:var(--mono); letter-spacing:0.15em; margin-bottom:20px; text-align:center; }
  .modal-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-row label { font-size:14px; color:var(--text2); }
  .modal-input { background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:16px; font-family:var(--mono); padding:8px 12px; width:140px; text-align:right; outline:none; -webkit-appearance:none; }
  .modal-input:focus { border-color:var(--green); }
  .modal-input-full { background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:15px; font-family:var(--sans); padding:8px 12px; width:100%; outline:none; -webkit-appearance:none; }
  .modal-input-full:focus { border-color:var(--green); }
  .modal-divider { height:1px; background:var(--border); margin:16px 0; }
  .modal-section-label { font-size:11px; color:var(--text3); font-family:var(--mono); letter-spacing:0.15em; margin-bottom:12px; }
  .theme-selector { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
  .theme-opt { background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text2); font-size:13px; padding:10px 6px; cursor:pointer; text-align:center; -webkit-appearance:none; transition:all 0.15s; }
  .theme-opt.active { border-color:var(--green); color:var(--green); background:rgba(0,168,84,0.08); }
  .edit-cat-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .modal-save { width:100%; background:var(--green); color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; padding:14px; cursor:pointer; margin-top:8px; -webkit-appearance:none; }
  html[data-theme="dark"] .modal-save, html[data-theme="system"] .modal-save { color:#000; }
  @media (prefers-color-scheme:dark) { html[data-theme="system"] .modal-save { color:#000; } }
  .modal-delete { width:100%; background:none; border:1px solid var(--border); border-radius:12px; font-size:14px; color:var(--red); padding:12px; cursor:pointer; margin-top:8px; -webkit-appearance:none; }
  .modal-delete:active { background:var(--red-dim); }
  .settings-fab { position:fixed; bottom:28px; right:20px; width:48px; height:48px; background:var(--surface); border:1px solid var(--border); border-radius:50%; color:var(--text3); font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; -webkit-appearance:none; z-index:50; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">残り枠</div>
    <div class="header-version">v1.7.0</div>
  </div>
  <div class="header-month" id="monthLabel"></div>
</div>

<div class="hero">
  <div class="hero-label">PRIVATE · REMAINING</div>
  <div class="hero-amount ok" id="heroAmount">¥0</div>
  <div class="hero-sub" id="heroSub">上限を設定してください</div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
<div class="alert" id="alertBanner"></div>

<div class="stats">
  <div class="stat"><div class="stat-label">上限</div><div class="stat-value" id="statLimit">—</div></div>
  <div class="stat"><div class="stat-label">使用済</div><div class="stat-value" id="statSpent">¥0</div></div>
  <div class="stat"><div class="stat-label">交通費</div><div class="stat-value transport" id="statTransport">¥0</div></div>
</div>

<div class="breakdown-section">
  <div class="breakdown-header" onclick="toggleBreakdown()">
    <div class="breakdown-title">BREAKDOWN</div>
    <div class="breakdown-toggle" id="breakdownToggle">▼</div>
  </div>
  <div class="breakdown-body" id="breakdownBody">
    <div class="breakdown-list" id="breakdownList"></div>
  </div>
</div>

<div class="input-section">
  <div class="input-card">
    <div class="input-label">ADD EXPENSE</div>
    <div class="amount-input-wrap">
      <span class="yen-sign">¥</span>
      <input type="number" class="amount-input" id="amountInput" placeholder="0" inputmode="numeric">
    </div>
    <input type="text" class="memo-input" id="memoInput" placeholder="どこで何を（例：セブン　コーヒー）" maxlength="30">
    <div class="cat-row">
      <button class="cat-btn active" id="catPrivate" onclick="setCategory('private')">🛒 私用</button>
      <button class="cat-btn transport-btn" id="catTransport" onclick="setCategory('transport')">🚃 交通費</button>
    </div>
    <button class="submit-btn" id="submitBtn" onclick="addExpense()">記録する</button>
  </div>
</div>

<div class="history-section">
  <div class="section-header">
    <div class="section-title">HISTORY</div>
    <button class="clear-btn" onclick="confirmClearMonth()">月リセット</button>
  </div>
  <div class="edit-hint">項目をタップで編集</div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">SETTINGS</div>
    <div class="modal-row">
      <label>カード上限</label>
      <input type="number" class="modal-input" id="settingLimit" inputmode="numeric" placeholder="100000">
    </div>
    <div class="modal-row">
      <label>交通費確保額</label>
      <input type="number" class="modal-input" id="settingTransport" inputmode="numeric" placeholder="15000">
    </div>
    <div class="modal-divider"></div>
    <div class="modal-section-label">THEME</div>
    <div class="theme-selector">
      <button class="theme-opt" id="themeLight" onclick="setTheme('light')">☀️ ライト</button>
      <button class="theme-opt" id="themeDark" onclick="setTheme('dark')">🌙 ダーク</button>
      <button class="theme-opt active" id="themeSystem" onclick="setTheme('system')">⚙️ システム</button>
    </div>
    <button class="modal-save" onclick="saveSettings()">保存</button>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editOverlay" onclick="closeEditModal(event)">
  <div class="modal">
    <div class="modal-title">EDIT</div>
    <div class="modal-row">
      <label>金額</label>
      <input type="number" class="modal-input" id="editAmount" inputmode="numeric">
    </div>
    <div style="margin-bottom:16px;">
      <label style="font-size:14px;color:var(--text2);display:block;margin-bottom:8px;">メモ</label>
      <input type="text" class="modal-input-full" id="editMemo" maxlength="30" placeholder="どこで何を">
    </div>
    <div class="modal-section-label">カテゴリ</div>
    <div class="edit-cat-row">
      <button class="cat-btn active" id="editCatPrivate" onclick="setEditCat('private')">🛒 私用</button>
      <button class="cat-btn transport-btn" id="editCatTransport" onclick="setEditCat('transport')">🚃 交通費</button>
    </div>
    <button class="modal-save" onclick="saveEdit()">保存</button>
    <button class="modal-delete" onclick="deleteFromEdit()">削除</button>
  </div>
</div>

<button class="settings-fab" onclick="openModal()">⚙</button>

<script>
const STORE_KEY = 'kakeibo_v1';

// カテゴリ定義
const CATS = [
  { key:'convenience', label:'コンビニ', emoji:'🏪', color:'#5b8dee', bg:'rgba(91,141,238,0.10)', border:'rgba(91,141,238,0.25)',
    keywords:['セブン','7-eleven','711','ローソン','ファミマ','ファミリーマート','ミニストップ','デイリー','newdays','ニューデイズ','セイコーマート'] },
  { key:'super', label:'スーパー', emoji:'🛒', color:'#43c59e', bg:'rgba(67,197,158,0.10)', border:'rgba(67,197,158,0.25)',
    keywords:['スーパー','イオン','西友','ライフ','マルエツ','サミット','オーケー','ヨーカドー','ベルク','ロピア','フードワン','まいばすけっと','まいばす','業務スーパー','コープ'] },
  { key:'ec', label:'ネット通販', emoji:'📦', color:'#ff9757', bg:'rgba(255,151,87,0.10)', border:'rgba(255,151,87,0.25)',
    keywords:['amazon','アマゾン','楽天','yahoo','ヤフー','メルカリ','zozotown','ゾゾ','qoo10'] },
  { key:'food', label:'外食', emoji:'🍜', color:'#f06292', bg:'rgba(240,98,146,0.10)', border:'rgba(240,98,146,0.25)',
    keywords:['外食','マクドナルド','マック','mos','モス','すき家','吉野家','松屋','サイゼ','ガスト','デニーズ','餃子','ラーメン','寿司','焼肉','カフェ','スタバ','ドトール'] },
  { key:'other', label:'その他', emoji:'💳', color:'#888', bg:'rgba(136,136,136,0.08)', border:'rgba(136,136,136,0.15)', keywords:[] },
];

function detectCat(memo) {
  if (!memo) return 'other';
  const m = memo.toLowerCase();
  for (const c of CATS) {
    if (c.key === 'other') continue;
    if (c.keywords.some(k => m.includes(k.toLowerCase()))) return c.key;
  }
  return 'other';
}

function getCat(key) { return CATS.find(c => c.key === key) || CATS[CATS.length-1]; }

function load() { try { return migrate(JSON.parse(localStorage.getItem(STORE_KEY)) || defaultData()); } catch(e) { return defaultData(); } }
function defaultData() { return { limit:100000, transportBudget:15000, entries:[], month:currentMonth(), theme:'system' }; }
function currentMonth() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function save(data) { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function migrate(data) {
  data.entries = data.entries.map(e => {
    if (!e.date) e.date = '—';
    return e;
  });
  return data;
}
function fmt(n) { return '¥' + Math.abs(n).toLocaleString('ja-JP'); }
function fmtShort(n) { return '¥' + Math.abs(n).toLocaleString('ja-JP'); }

let selectedCategory = 'private';
let pendingTheme = 'system';
let editingId = null;
let editingCat = 'private';

function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); }
function setTheme(t) {
  pendingTheme = t;
  ['light','dark','system'].forEach(x => {
    document.getElementById('theme'+x.charAt(0).toUpperCase()+x.slice(1)).className = 'theme-opt'+(x===t?' active':'');
  });
}
function setCategory(cat) {
  selectedCategory = cat;
  document.getElementById('catPrivate').className = 'cat-btn'+(cat==='private'?' active':'');
  document.getElementById('catTransport').className = 'cat-btn transport-btn'+(cat==='transport'?' active':'');
  document.getElementById('submitBtn').className = 'submit-btn'+(cat==='transport'?' transport-mode':'');
}
function setEditCat(cat) {
  editingCat = cat;
  document.getElementById('editCatPrivate').className = 'cat-btn'+(cat==='private'?' active':'');
  document.getElementById('editCatTransport').className = 'cat-btn transport-btn'+(cat==='transport'?' active':'');
}

function addExpense() {
  const val = parseInt(document.getElementById('amountInput').value);
  if (!val || val <= 0) { document.getElementById('amountInput').focus(); return; }
  const memo = document.getElementById('memoInput').value.trim();
  const data = load();
  if (data.month !== currentMonth()) { data.entries = []; data.month = currentMonth(); }
  const now = new Date();
  data.entries.unshift({ id:Date.now(), amount:val, category:selectedCategory, memo:memo,
    date:`${now.getMonth()+1}/${now.getDate()}`,
    time:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` });
  save(data);
  document.getElementById('amountInput').value = '';
  document.getElementById('memoInput').value = '';
  render();
}

function openEditModal(id) {
  const data = load();
  const entry = data.entries.find(e => e.id === id);
  if (!entry) return;
  editingId = id;
  document.getElementById('editAmount').value = entry.amount;
  document.getElementById('editMemo').value = entry.memo || '';
  setEditCat(entry.category);
  document.getElementById('editOverlay').classList.add('open');
}
function closeEditModal(e) {
  if (e.target === document.getElementById('editOverlay'))
    document.getElementById('editOverlay').classList.remove('open');
}
function saveEdit() {
  const val = parseInt(document.getElementById('editAmount').value);
  if (!val || val <= 0) { document.getElementById('editAmount').focus(); return; }
  const memo = document.getElementById('editMemo').value.trim();
  const data = load();
  const idx = data.entries.findIndex(e => e.id === editingId);
  if (idx !== -1) { data.entries[idx].amount = val; data.entries[idx].memo = memo; data.entries[idx].category = editingCat; }
  save(data);
  document.getElementById('editOverlay').classList.remove('open');
  render();
}
function deleteFromEdit() {
  if (!confirm('この項目を削除しますか？')) return;
  const data = load();
  data.entries = data.entries.filter(e => e.id !== editingId);
  save(data);
  document.getElementById('editOverlay').classList.remove('open');
  render();
}
function confirmClearMonth() {
  if (confirm('今月の記録をすべてリセットしますか？')) {
    const data = load(); data.entries = []; data.month = currentMonth(); save(data); render();
  }
}

function toggleBreakdown() {
  const body = document.getElementById('breakdownBody');
  const toggle = document.getElementById('breakdownToggle');
  body.classList.toggle('open');
  toggle.classList.toggle('open');
}

function render() {
  const data = load();
  if (data.month !== currentMonth()) { data.entries = []; data.month = currentMonth(); save(data); }

  const privateLimit = data.limit - data.transportBudget;
  const privateEntries = data.entries.filter(e=>e.category==='private');
  const transportSpent = data.entries.filter(e=>e.category==='transport').reduce((s,e)=>s+e.amount,0);
  const privateSpent = privateEntries.reduce((s,e)=>s+e.amount,0);
  const remaining = privateLimit - privateSpent;
  const pct = privateLimit > 0 ? Math.min((privateSpent/privateLimit)*100,100) : 0;

  const d = new Date();
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const remainDays = lastDay - d.getDate();
  document.getElementById('monthLabel').textContent = `${d.getMonth()+1}月 / 残り${remainDays}日`;

  const heroEl = document.getElementById('heroAmount');
  heroEl.textContent = fmt(remaining);
  heroEl.className = 'hero-amount '+(remaining<0?'over':pct>=80?'warn':'ok');
  document.getElementById('heroSub').textContent = `私用上限 ${fmtShort(privateLimit)} のうち ${fmtShort(privateSpent)} 使用`;

  const bar = document.getElementById('progressBar');
  bar.style.width = pct+'%';
  bar.style.background = pct>=100?'var(--red)':pct>=80?'var(--amber)':'var(--green)';

  const alert = document.getElementById('alertBanner');
  if (remaining < 0) { alert.textContent=`⚠️ 上限を ${fmt(-remaining)} オーバーしています`; alert.className='alert over'; }
  else if (pct >= 80) { alert.textContent=`残り枠が ${Math.round(100-pct)}% を切りました`; alert.className='alert warn'; }
  else { alert.className='alert'; }

  document.getElementById('statLimit').textContent = fmtShort(data.limit);
  document.getElementById('statSpent').textContent = fmtShort(privateSpent);
  document.getElementById('statTransport').textContent = fmtShort(transportSpent);

  // Breakdown
  const catTotals = {};
  privateEntries.forEach(e => {
    const ck = detectCat(e.memo);
    catTotals[ck] = (catTotals[ck]||0) + e.amount;
  });
  const maxAmt = Math.max(...Object.values(catTotals), 1);
  const bdList = document.getElementById('breakdownList');
  bdList.innerHTML = CATS.map(c => {
    const amt = catTotals[c.key] || 0;
    const hint = c.key === 'other' ? 'その他すべて' : c.keywords.slice(0,4).join('・') + '等';
    return `
      <div class="breakdown-item" style="background:${c.bg};border-color:${c.border};">
        <div class="breakdown-left">
          <div class="breakdown-dot" style="background:${amt>0?c.color:'var(--border)'}"></div>
          <div>
            <div class="breakdown-label">${c.emoji} ${c.label}</div>
            <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px;">${hint}</div>
          </div>
        </div>
        <div class="breakdown-amount" style="color:${amt>0?'var(--text)':'var(--text3)'};">${amt>0?fmt(amt):'—'}</div>
      </div>
    `;
  }).join('');

  // History
  const list = document.getElementById('historyList');
  if (data.entries.length === 0) {
    list.innerHTML = '<div class="empty-state">まだ記録がありません</div>';
  } else {
    list.innerHTML = data.entries.slice(0,50).map(e => {
      let bg, border, catColor, catLabel;
      if (e.category === 'transport') {
        bg='rgba(255,171,64,0.08)'; border='rgba(255,171,64,0.2)'; catColor='var(--amber)'; catLabel='🚃 交通費';
      } else {
        const c = getCat(detectCat(e.memo));
        bg=c.bg; border=c.border; catColor=c.color; catLabel=`${c.emoji} ${c.label}`;
      }
      return `
        <div class="history-item" style="background:${bg};border-color:${border};" onclick="openEditModal(${e.id})">
          <div class="history-left">
            <div class="history-cat" style="color:${catColor};">${catLabel} · ${e.date||'—'} ${e.time}</div>
            ${e.memo?`<div class="history-memo">${e.memo}</div>`:'<div class="history-memo" style="color:var(--text3)">—</div>'}
          </div>
          <div class="history-right">
            <div class="history-amount">${fmt(e.amount)}</div>
            <span style="color:var(--text3);font-size:13px;margin-left:8px;">›</span>
          </div>
        </div>`;
    }).join('');
  }
}

function openModal() {
  const data = load();
  document.getElementById('settingLimit').value = data.limit;
  document.getElementById('settingTransport').value = data.transportBudget;
  pendingTheme = data.theme || 'system';
  setTheme(pendingTheme);
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}
function saveSettings() {
  const data = load();
  const limit = parseInt(document.getElementById('settingLimit').value);
  const transport = parseInt(document.getElementById('settingTransport').value);
  if (limit > 0) data.limit = limit;
  if (transport >= 0) data.transportBudget = transport;
  data.theme = pendingTheme;
  save(data); applyTheme(pendingTheme);
  document.getElementById('modalOverlay').classList.remove('open');
  render();
}

const initData = load();
applyTheme(initData.theme || 'system');
render();
</script>
</body>
</html>
